<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
  <title id="title">One profile, four questions</title>
  <desc id="desc">A comparison matrix for eight robot-data sources. Action grounding and collection burden share one blue scale, with darker color meaning greater burden. Actor mismatch and world mismatch share one green-to-teal scale, with darker color meaning farther from the target under a rough default order.</desc>
  <defs>
    <style>
      .burden-low { fill: #e7f0f5; }
      .burden-low-medium { fill: #d3e3ec; }
      .burden-medium { fill: #acc8d9; }
      .burden-high { fill: #76a0bb; }
      .burden-maximum { fill: #4f7c9b; }
      .mismatch-low { fill: #dff0e8; }
      .mismatch-medium { fill: #8fc0a9; }
      .mismatch-high { fill: #3f736b; }
      .on-mismatch-dark { fill: #ffffff; }
      .mismatch-low + text,
      .mismatch-low + text + text,
      .mismatch-medium + text,
      .mismatch-medium + text + text { fill: #1d4039; }
      .on-maximum { fill: #ffffff; }
    </style>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfaf5"/>
      <stop offset="1" stop-color="#f0ebe2"/>
    </linearGradient>
    <linearGradient id="burden-scale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7f0f5"/>
      <stop offset="0.5" stop-color="#acc8d9"/>
      <stop offset="1" stop-color="#4f7c9b"/>
    </linearGradient>
    <linearGradient id="mismatch-scale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dff0e8"/>
      <stop offset="0.5" stop-color="#8fc0a9"/>
      <stop offset="1" stop-color="#3f736b"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#192338" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="1080" rx="36" fill="url(#paper)"/>
  <rect x="1" y="1" width="1198" height="1078" rx="35" fill="none" stroke="#d9d4ca" stroke-width="2"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="50" y="69" fill="#1e293a" font-size="38" font-weight="780">One profile, four questions</text>
    <text x="50" y="108" fill="#687386" font-size="19">A compact comparison of common robot-data sources.</text>
    <g transform="translate(864 45)">
      <rect width="286" height="46" rx="23" fill="#f8eed9"/>
      <circle cx="24" cy="23" r="7" fill="#d69a37"/>
      <text x="45" y="29" fill="#825819" font-size="15" font-weight="760" letter-spacing="1.1">COMPARE WITHIN A COLUMN</text>
    </g>

    <g font-size="16" font-weight="760" fill="#354258">
      <text x="50" y="181">SOURCE</text>
      <g text-anchor="middle">
        <text x="412" y="169" font-family="'STIX Two Math', 'Cambria Math', 'Noto Sans Math', 'DejaVu Math TeX Gyre', serif" font-size="25" font-style="italic">D<tspan baseline-shift="sub" font-size="16">A</tspan></text>
        <text x="412" y="198" font-size="14" letter-spacing="1">ACTION GROUNDING</text>
        <text x="627" y="169" font-family="'STIX Two Math', 'Cambria Math', 'Noto Sans Math', 'DejaVu Math TeX Gyre', serif" font-size="25" font-style="italic">D<tspan baseline-shift="sub" font-size="16">B</tspan></text>
        <text x="627" y="198" font-size="14" letter-spacing="1">ACTOR MISMATCH</text>
        <text x="842" y="169" font-family="'STIX Two Math', 'Cambria Math', 'Noto Sans Math', 'DejaVu Math TeX Gyre', serif" font-size="25" font-style="italic">D<tspan baseline-shift="sub" font-size="16">W</tspan></text>
        <text x="842" y="198" font-size="14" letter-spacing="1">WORLD MISMATCH</text>
        <text x="1057" y="169" font-family="'STIX Two Math', 'Cambria Math', 'Noto Sans Math', 'DejaVu Math TeX Gyre', serif" font-size="25" font-style="italic">C</text>
        <text x="1057" y="198" font-size="14" letter-spacing="1">COLLECTION BURDEN</text>
      </g>
    </g>

    <!-- Internet video -->
    <g transform="translate(40 230)">
      <rect width="260" height="72" rx="18" fill="#ffffff" filter="url(#shadow)"/>
      <text x="18" y="44" fill="#263247" font-size="18" font-weight="700">Internet video</text>
      <rect class="burden-maximum" x="270" width="205" height="72" rx="18"/>
      <text class="on-maximum" x="372.5" y="44" text-anchor="middle" font-size="18" font-weight="720">Unobserved</text>
      <rect class="mismatch-medium" x="485" width="205" height="72" rx="18"/>
      <text class="on-mismatch-dark" x="587.5" y="44" text-anchor="middle" font-size="17" font-weight="700">Human / mixed</text>
      <rect class="mismatch-medium" x="700" width="205" height="72" rx="18"/>
      <text class="on-mismatch-dark" x="802.5" y="44" text-anchor="middle" font-size="18" font-weight="700">Other real</text>
      <rect class="burden-low" x="915" width="205" height="72" rx="18"/>
      <text x="1017.5" y="44" text-anchor="middle" fill="#815c1f" font-size="18" font-weight="700">Low*</text>
    </g>

    <!-- Egocentric video -->
    <g transform="translate(40 312)">
      <rect width="260" height="72" rx="18" fill="#ffffff" filter="url(#shadow)"/>
      <text x="18" y="44" fill="#263247" font-size="18" font-weight="700">Egocentric video</text>
      <rect class="burden-high" x="270" width="205" height="72" rx="18"/>
      <text x="372.5" y="44" text-anchor="middle" fill="#263247" font-size="18" font-weight="720">Inferred</text>
      <rect class="mismatch-medium" x="485" width="205" height="72" rx="18"/>
      <text class="on-mismatch-dark" x="587.5" y="44" text-anchor="middle" font-size="18" font-weight="700">Human</text>
      <rect class="mismatch-medium" x="700" width="205" height="72" rx="18"/>
      <text class="on-mismatch-dark" x="802.5" y="44" text-anchor="middle" font-size="18" font-weight="700">Other real</text>
      <rect class="burden-low-medium" x="915" width="205" height="72" rx="18"/>
      <text x="1017.5" y="44" text-anchor="middle" fill="#263247" font-size="17" font-weight="700">Low–medium</text>
    </g>

    <!-- UMI -->
    <g transform="translate(40 394)">
      <rect width="260" height="72" rx="18" fill="#ffffff" filter="url(#shadow)"/>
      <text x="18" y="44" fill="#263247" font-size="18" font-weight="700">UMI-style capture</text>
      <rect class="burden-medium" x="270" width="205" height="72" rx="18"/>
      <text x="372.5" y="44" text-anchor="middle" fill="#263247" font-size="18" font-weight="720">Mapped</text>
      <rect class="mismatch-medium" x="485" width="205" height="72" rx="18"/>
      <text class="on-mismatch-dark" x="587.5" y="44" text-anchor="middle" font-size="18" font-weight="700">Human</text>
      <rect class="mismatch-medium" x="700" width="205" height="72" rx="18"/>
      <text class="on-mismatch-dark" x="802.5" y="44" text-anchor="middle" font-size="18" font-weight="700">Other real</text>
      <rect class="burden-medium" x="915" width="205" height="72" rx="18"/>
      <text x="1017.5" y="44" text-anchor="middle" fill="#263247" font-size="18" font-weight="700">Medium</text>
    </g>

    <!-- Real human teleoperation -->
    <g transform="translate(40 476)">
      <rect width="260" height="72" rx="18" fill="#ffffff" filter="url(#shadow)"/>
      <text x="18" y="44" fill="#263247" font-size="18" font-weight="700">Real human teleoperation</text>
      <rect class="burden-low" x="270" width="205" height="72" rx="18"/>
      <text x="372.5" y="44" text-anchor="middle" fill="#51449c" font-size="18" font-weight="720">Exact*</text>
      <rect class="mismatch-medium" x="485" width="205" height="72" rx="18"/>
      <text class="on-mismatch-dark" x="587.5" y="44" text-anchor="middle" font-size="18" font-weight="700">Human</text>
      <rect class="mismatch-low" x="700" width="205" height="72" rx="18"/>
      <text class="on-mismatch-dark" x="802.5" y="44" text-anchor="middle" font-size="18" font-weight="700">Target real*</text>
      <rect class="burden-high" x="915" width="205" height="72" rx="18"/>
      <text x="1017.5" y="44" text-anchor="middle" fill="#263247" font-size="18" font-weight="720">High</text>
    </g>

    <!-- Simulated script/planner -->
    <g transform="translate(40 558)">
      <rect width="260" height="72" rx="18" fill="#ffffff" filter="url(#shadow)"/>
      <text x="18" y="44" fill="#263247" font-size="18" font-weight="700">Simulated script / planner</text>
      <rect class="burden-low" x="270" width="205" height="72" rx="18"/>
      <text x="372.5" y="44" text-anchor="middle" fill="#51449c" font-size="18" font-weight="720">Exact*</text>
      <rect class="mismatch-high" x="485" width="205" height="72" rx="18"/>
      <text class="on-mismatch-dark" x="587.5" y="44" text-anchor="middle" font-size="17" font-weight="700">Script / planner</text>
      <rect class="mismatch-high" x="700" width="205" height="72" rx="18"/>
      <text class="on-mismatch-dark" x="802.5" y="44" text-anchor="middle" font-size="18" font-weight="700">Simulated</text>
      <rect class="burden-low" x="915" width="205" height="72" rx="18"/>
      <text x="1017.5" y="44" text-anchor="middle" fill="#815c1f" font-size="18" font-weight="700">Low*</text>
    </g>

    <!-- Simulated human teleoperation -->
    <g transform="translate(40 640)">
      <rect width="260" height="72" rx="18" fill="#ffffff" filter="url(#shadow)"/>
      <text x="18" y="44" fill="#263247" font-size="18" font-weight="700">Simulated human teleop</text>
      <rect class="burden-low" x="270" width="205" height="72" rx="18"/>
      <text x="372.5" y="44" text-anchor="middle" fill="#51449c" font-size="18" font-weight="720">Exact*</text>
      <rect class="mismatch-medium" x="485" width="205" height="72" rx="18"/>
      <text class="on-mismatch-dark" x="587.5" y="44" text-anchor="middle" font-size="18" font-weight="700">Human</text>
      <rect class="mismatch-high" x="700" width="205" height="72" rx="18"/>
      <text class="on-mismatch-dark" x="802.5" y="44" text-anchor="middle" font-size="18" font-weight="700">Simulated</text>
      <rect class="burden-medium" x="915" width="205" height="72" rx="18"/>
      <text x="1017.5" y="44" text-anchor="middle" fill="#263247" font-size="18" font-weight="700">Medium</text>
    </g>

    <!-- Real target-policy rollout -->
    <g transform="translate(40 722)">
      <rect width="260" height="72" rx="18" fill="#ffffff" filter="url(#shadow)"/>
      <text x="18" y="44" fill="#263247" font-size="18" font-weight="700">Real target-policy rollout</text>
      <rect class="burden-low" x="270" width="205" height="72" rx="18"/>
      <text x="372.5" y="44" text-anchor="middle" fill="#51449c" font-size="18" font-weight="720">Exact*</text>
      <rect class="mismatch-low" x="485" width="205" height="72" rx="18"/>
      <text class="on-mismatch-dark" x="587.5" y="44" text-anchor="middle" font-size="18" font-weight="700">Target policy</text>
      <rect class="mismatch-low" x="700" width="205" height="72" rx="18"/>
      <text class="on-mismatch-dark" x="802.5" y="44" text-anchor="middle" font-size="18" font-weight="700">Target real*</text>
      <rect class="burden-high" x="915" width="205" height="72" rx="18"/>
      <text x="1017.5" y="44" text-anchor="middle" fill="#263247" font-size="18" font-weight="720">High</text>
    </g>

    <!-- Simulated target-policy rollout -->
    <g transform="translate(40 804)">
      <rect width="260" height="72" rx="18" fill="#ffffff" filter="url(#shadow)"/>
      <text x="18" y="44" fill="#263247" font-size="18" font-weight="700">Sim target-policy rollout</text>
      <rect class="burden-low" x="270" width="205" height="72" rx="18"/>
      <text x="372.5" y="44" text-anchor="middle" fill="#51449c" font-size="18" font-weight="720">Exact*</text>
      <rect class="mismatch-low" x="485" width="205" height="72" rx="18"/>
      <text class="on-mismatch-dark" x="587.5" y="44" text-anchor="middle" font-size="18" font-weight="700">Target policy</text>
      <rect class="mismatch-high" x="700" width="205" height="72" rx="18"/>
      <text class="on-mismatch-dark" x="802.5" y="44" text-anchor="middle" font-size="18" font-weight="700">Simulated</text>
      <rect class="burden-low" x="915" width="205" height="72" rx="18"/>
      <text x="1017.5" y="44" text-anchor="middle" fill="#815c1f" font-size="18" font-weight="700">Low*</text>
    </g>

    <g transform="translate(40 916)">
      <rect width="1120" height="116" rx="24" fill="#ffffff" opacity="0.88"/>
      <rect x="24" y="24" width="146" height="18" rx="9" fill="url(#burden-scale)"/>
      <text x="188" y="40" fill="#354258" font-size="17" font-weight="680">In <tspan font-family="'STIX Two Math', 'Cambria Math', 'Noto Sans Math', 'DejaVu Math TeX Gyre', serif" font-style="italic">D<tspan baseline-shift="sub" font-size="12">A</tspan></tspan> and <tspan font-family="'STIX Two Math', 'Cambria Math', 'Noto Sans Math', 'DejaVu Math TeX Gyre', serif" font-style="italic">C</tspan>, darker means more burden.</text>
      <rect x="626" y="24" width="104" height="18" rx="9" fill="url(#mismatch-scale)"/>
      <text x="746" y="40" fill="#354258" font-size="17" font-weight="680">In <tspan font-family="'STIX Two Math', 'Cambria Math', 'Noto Sans Math', 'DejaVu Math TeX Gyre', serif" font-style="italic">D<tspan baseline-shift="sub" font-size="12">B</tspan></tspan> and <tspan font-family="'STIX Two Math', 'Cambria Math', 'Noto Sans Math', 'DejaVu Math TeX Gyre', serif" font-style="italic">D<tspan baseline-shift="sub" font-size="12">W</tspan></tspan>, darker means farther from target.</text>
      <text x="24" y="82" fill="#687386" font-size="16">* Conditional terms are defined in the note below. Compare down a column; never add the four fields.</text>
    </g>
  </g>
</svg>
