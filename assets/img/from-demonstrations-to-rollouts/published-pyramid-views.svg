<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Three published robot-data pyramid views</title>
  <desc id="desc">Three schematic mini-pyramids summarize published robot-data views. NVIDIA GR00T N1 moves from web and human video through synthetic data to real robot data. Tanay Jaipuria moves from internet, ego, enriched ego, handheld, simulation, and teleoperation to deployment. A survey by Ye and colleagues moves from general data through simulation, ego, and UMI to robot data.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfaf5"/>
      <stop offset="1" stop-color="#f0ebe2"/>
    </linearGradient>
    <filter id="shadow" x="-16%" y="-20%" width="132%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#192338" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect width="1200" height="690" rx="36" fill="url(#paper)"/>
  <rect x="1" y="1" width="1198" height="688" rx="35" fill="none" stroke="#d9d4ca" stroke-width="2"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="60" y="66" fill="#1e293a" font-size="33" font-weight="790">Three published pyramid views</text>
    <g transform="translate(865 52)">
      <rect width="275" height="40" rx="20" fill="#f8eed9"/>
      <circle cx="22" cy="20" r="7" fill="#d69a37"/>
      <text x="42" y="26" fill="#825819" font-size="14" font-weight="780" letter-spacing="1.1">ILLUSTRATIVE · NO SHARED SCALE</text>
    </g>

    <g transform="translate(60 120)" filter="url(#shadow)">
      <rect width="340" height="522" rx="28" fill="#ffffff"/>
      <text x="26" y="44" fill="#263247" font-size="22" font-weight="780">NVIDIA GR00T N1</text>

      <g transform="translate(30 85)">
        <path d="M 102 0 H 178 L 204 92 H 76 Z" fill="#f2c77e"/>
        <text x="140" y="49" text-anchor="middle" fill="#714c17" font-size="16" font-weight="760">real robot</text>
        <path d="M 76 102 H 204 L 234 194 H 46 Z" fill="#dcd5f3"/>
        <text x="140" y="151" text-anchor="middle" fill="#5547aa" font-size="16" font-weight="760">synthetic</text>
        <path d="M 46 204 H 234 L 280 316 H 0 Z" fill="#e8edf1"/>
        <text x="140" y="253" text-anchor="middle" fill="#39475b" font-size="16" font-weight="760">web + human video</text>
        <text x="140" y="281" text-anchor="middle" fill="#647184" font-size="14">broad pretraining sources</text>
      </g>

      <rect x="26" y="462" width="288" height="36" rx="18" fill="#f6f2ea"/>
      <text x="170" y="486" text-anchor="middle" fill="#5d6878" font-size="14" font-weight="660">source: GR00T N1 data pyramid</text>
    </g>

    <g transform="translate(430 120)" filter="url(#shadow)">
      <rect width="340" height="522" rx="28" fill="#ffffff"/>
      <text x="26" y="44" fill="#263247" font-size="22" font-weight="780">Tanay Jaipuria</text>

      <g transform="translate(30 85)">
        <path d="M 121 0 H 159 L 171 42 H 109 Z" fill="#f2c77e"/>
        <text x="140" y="28" text-anchor="middle" fill="#714c17" font-size="13" font-weight="760">deployment</text>
        <path d="M 108 48 H 172 L 190 90 H 90 Z" fill="#cdeae6"/>
        <text x="140" y="76" text-anchor="middle" fill="#126e6b" font-size="13" font-weight="760">teleop</text>
        <path d="M 89 96 H 191 L 209 138 H 71 Z" fill="#dcd5f3"/>
        <text x="140" y="124" text-anchor="middle" fill="#5547aa" font-size="13" font-weight="760">simulation</text>
        <path d="M 70 144 H 210 L 228 186 H 52 Z" fill="#e8e2f6"/>
        <text x="140" y="172" text-anchor="middle" fill="#5547aa" font-size="13" font-weight="760">handheld</text>
        <path d="M 51 192 H 229 L 247 234 H 33 Z" fill="#dff2ef"/>
        <text x="140" y="220" text-anchor="middle" fill="#216f6c" font-size="13" font-weight="760">enriched ego</text>
        <path d="M 32 240 H 248 L 266 282 H 14 Z" fill="#e7ecef"/>
        <text x="140" y="268" text-anchor="middle" fill="#465469" font-size="13" font-weight="760">ego</text>
        <path d="M 13 288 H 267 L 280 338 H 0 Z" fill="#dfe4e8"/>
        <text x="140" y="319" text-anchor="middle" fill="#39475b" font-size="13" font-weight="760">internet</text>
      </g>

      <rect x="26" y="462" width="288" height="36" rx="18" fill="#f6f2ea"/>
      <text x="170" y="486" text-anchor="middle" fill="#5d6878" font-size="14" font-weight="660">source: The Data Pyramid in Robotics</text>
    </g>

    <g transform="translate(800 120)" filter="url(#shadow)">
      <rect width="340" height="522" rx="28" fill="#ffffff"/>
      <text x="26" y="44" fill="#263247" font-size="22" font-weight="780">Ye et al. survey</text>

      <g transform="translate(30 90)">
        <path d="M 112 0 H 168 L 185 58 H 95 Z" fill="#f2c77e"/>
        <text x="140" y="37" text-anchor="middle" fill="#714c17" font-size="15" font-weight="760">robot</text>
        <path d="M 94 66 H 186 L 207 124 H 73 Z" fill="#e8e2f6"/>
        <text x="140" y="102" text-anchor="middle" fill="#5547aa" font-size="15" font-weight="760">UMI</text>
        <path d="M 72 132 H 208 L 229 190 H 51 Z" fill="#dff2ef"/>
        <text x="140" y="168" text-anchor="middle" fill="#216f6c" font-size="15" font-weight="760">ego</text>
        <path d="M 50 198 H 230 L 251 256 H 29 Z" fill="#dcd5f3"/>
        <text x="140" y="234" text-anchor="middle" fill="#5547aa" font-size="15" font-weight="760">simulation</text>
        <path d="M 28 264 H 252 L 280 338 H 0 Z" fill="#dfe4e8"/>
        <text x="140" y="308" text-anchor="middle" fill="#39475b" font-size="15" font-weight="760">general</text>
      </g>

      <rect x="26" y="462" width="288" height="36" rx="18" fill="#f6f2ea"/>
      <text x="170" y="486" text-anchor="middle" fill="#5d6878" font-size="14" font-weight="660">source: Ye et al. robot-data survey</text>
    </g>
  </g>
</svg>
