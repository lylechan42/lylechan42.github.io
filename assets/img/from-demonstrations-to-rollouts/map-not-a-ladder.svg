<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">A map, not a ladder</title>
  <desc id="desc">A categorical map organizes robot data by who acts—an expert or exogenous actor versus the target policy—and where the world responds—reality versus simulation. Categories include ego video, UMI, teleoperation, scripted and MimicGen data, planner or reinforcement-learning expert data, real target-policy rollouts, and simulated target-policy rollouts. Position and spacing do not represent data quality or measured distance.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfaf5"/>
      <stop offset="1" stop-color="#f0ebe2"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f5f2"/>
      <stop offset="1" stop-color="#d9ece8"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#192338" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect width="1200" height="880" rx="36" fill="url(#paper)"/>
  <rect x="1" y="1" width="1198" height="878" rx="35" fill="none" stroke="#d9d4ca" stroke-width="2"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="62" y="66" fill="#1e293a" font-size="34" font-weight="790">A map, not a ladder</text>
    <text x="62" y="103" fill="#687386" font-size="18">Two categorical questions separate behavior provenance from world substrate.</text>
    <g transform="translate(895 49)">
      <rect width="243" height="42" rx="21" fill="#f8eed9"/>
      <circle cx="23" cy="21" r="7" fill="#d69a37"/>
      <text x="43" y="27" fill="#825819" font-size="15" font-weight="780" letter-spacing="1.25">CATEGORICAL · NOT TO SCALE</text>
    </g>

    <text x="672" y="147" text-anchor="middle" fill="#354258" font-size="16" font-weight="760" letter-spacing="1.7">WHO ACTS?</text>
    <g transform="translate(192 163)">
      <rect width="455" height="56" rx="18" fill="#eeeaf8"/>
      <circle cx="28" cy="28" r="8" fill="#6f5bd3"/>
      <text x="50" y="35" fill="#5547aa" font-size="18" font-weight="760">EXPERT / EXOGENOUS ACTOR</text>
    </g>
    <g transform="translate(667 163)">
      <rect width="471" height="56" rx="18" fill="#dff2ef"/>
      <circle cx="28" cy="28" r="8" fill="#168d89"/>
      <text x="50" y="35" fill="#126e6b" font-size="18" font-weight="760">TARGET POLICY</text>
    </g>

    <g transform="translate(46 247)">
      <rect width="116" height="246" rx="24" fill="#ffffff" filter="url(#shadow)"/>
      <circle cx="58" cy="43" r="11" fill="#d69a37"/>
      <text x="58" y="94" text-anchor="middle" fill="#354258" font-size="17" font-weight="780">REAL</text>
      <text x="58" y="119" text-anchor="middle" fill="#354258" font-size="17" font-weight="780">WORLD</text>
      <path d="M 58 144 V 202" stroke="#c7ced8" stroke-width="3"/>
      <circle cx="58" cy="218" r="11" fill="#d69a37"/>
    </g>
    <g transform="translate(46 514)">
      <rect width="116" height="246" rx="24" fill="#ffffff" filter="url(#shadow)"/>
      <rect x="47" y="32" width="22" height="22" rx="6" fill="#6f5bd3"/>
      <text x="58" y="94" text-anchor="middle" fill="#354258" font-size="16" font-weight="780">SIMULATED</text>
      <text x="58" y="119" text-anchor="middle" fill="#354258" font-size="16" font-weight="780">WORLD</text>
      <path d="M 58 144 V 202" stroke="#c7ced8" stroke-width="3" stroke-dasharray="8 8"/>
      <rect x="47" y="207" width="22" height="22" rx="6" fill="#6f5bd3"/>
    </g>
    <text transform="translate(27 505) rotate(-90)" text-anchor="middle" fill="#596679" font-size="15" font-weight="760" letter-spacing="1.5">WHERE DOES THE WORLD RESPOND?</text>

    <g transform="translate(192 247)" filter="url(#shadow)">
      <rect width="455" height="246" rx="28" fill="#ffffff"/>
      <text x="28" y="47" fill="#6f5bd3" font-size="14" font-weight="780" letter-spacing="1.35">REAL · EXPERT-GENERATED</text>
      <text x="28" y="84" fill="#263247" font-size="24" font-weight="750">Captured teacher behavior</text>
      <g transform="translate(28 111)">
        <rect width="112" height="42" rx="21" fill="#f0edf9"/>
        <text x="56" y="27" text-anchor="middle" fill="#5547aa" font-size="16" font-weight="680">Ego video</text>
        <rect x="120" width="90" height="42" rx="21" fill="#f0edf9"/>
        <text x="165" y="27" text-anchor="middle" fill="#5547aa" font-size="16" font-weight="680">UMI</text>
        <rect x="218" width="126" height="42" rx="21" fill="#e5e0f5"/>
        <text x="281" y="27" text-anchor="middle" fill="#5547aa" font-size="16" font-weight="680">Teleoperation</text>
      </g>
      <text x="28" y="192" fill="#657185" font-size="16">Useful for teaching competent behavior.</text>
      <text x="28" y="218" fill="#87909d" font-size="14">Chips are categories; spacing is decorative.</text>
    </g>

    <g transform="translate(667 247)" filter="url(#shadow)">
      <rect width="471" height="246" rx="28" fill="#ffffff"/>
      <text x="28" y="47" fill="#168d89" font-size="14" font-weight="780" letter-spacing="1.35">REAL · TARGET-POLICY-GENERATED</text>
      <text x="28" y="89" fill="#263247" font-size="27" font-weight="760">Real target-policy rollouts</text>
      <rect x="28" y="115" width="415" height="52" rx="20" fill="#e5f4f2"/>
      <text x="235.5" y="148" text-anchor="middle" fill="#166f6b" font-size="18" font-weight="690">lab evaluation · deployment</text>
      <text x="28" y="201" fill="#657185" font-size="16">The candidate acts; reality responds.</text>
    </g>

    <g transform="translate(192 514)" filter="url(#shadow)">
      <rect width="455" height="246" rx="28" fill="#ffffff"/>
      <text x="28" y="47" fill="#6f5bd3" font-size="14" font-weight="780" letter-spacing="1.35">SIMULATION · EXPERT-GENERATED</text>
      <text x="28" y="84" fill="#263247" font-size="24" font-weight="750">Synthetic demonstrations</text>
      <g transform="translate(28 107)">
        <rect width="96" height="40" rx="20" fill="#f0edf9"/>
        <text x="48" y="26" text-anchor="middle" fill="#5547aa" font-size="15" font-weight="670">Scripted</text>
        <rect x="104" width="112" height="40" rx="20" fill="#f0edf9"/>
        <text x="160" y="26" text-anchor="middle" fill="#5547aa" font-size="15" font-weight="670">MimicGen</text>
        <rect x="224" width="172" height="40" rx="20" fill="#f0edf9"/>
        <text x="310" y="26" text-anchor="middle" fill="#5547aa" font-size="15" font-weight="670">Planner / RL expert</text>
      </g>
      <text x="28" y="190" fill="#657185" font-size="16">Interactive—but still teacher-induced states.</text>
      <text x="28" y="218" fill="#344258" font-size="15" font-weight="680">Ask which policy chose the actions.</text>
    </g>

    <g transform="translate(667 514)" filter="url(#shadow)">
      <rect x="1.5" y="1.5" width="468" height="243" rx="26.5" fill="url(#focus)" stroke="#168d89" stroke-width="3"/>
      <rect x="28" y="24" width="146" height="32" rx="16" fill="#cde8e4"/>
      <text x="101" y="46" text-anchor="middle" fill="#126e6b" font-size="13" font-weight="780" letter-spacing="1.15">ARTICLE FOCUS</text>
      <text x="28" y="95" fill="#137873" font-size="14" font-weight="780" letter-spacing="1.25">SIMULATION · TARGET POLICY</text>
      <text x="28" y="139" fill="#263247" font-size="26" font-weight="760">Sim target-policy rollouts</text>
      <path d="M 28 162 H 443" stroke="#afd5d0" stroke-width="2"/>
      <text x="28" y="195" fill="#536176" font-size="16">The same candidate acts.</text>
      <text x="28" y="222" fill="#657185" font-size="16">A simulated world supplies consequences.</text>
    </g>

    <g transform="translate(192 798)">
      <rect width="946" height="52" rx="20" fill="#202c3f"/>
      <circle cx="27" cy="26" r="8" fill="#d69a37"/>
      <text x="48" y="32" fill="#ffffff" font-size="17" font-weight="690">Categories describe provenance—not quality. Position and spacing are not measured distances.</text>
    </g>
  </g>
</svg>
