<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1500" viewBox="0 0 720 1500" role="img" aria-labelledby="title desc">
  <title id="title">Mobile view of the policy loop and research-decision loop</title>
  <desc id="desc">A simulated policy-environment feedback loop is followed by a separate research-decision sequence. The decision is sealed before protected real evidence audits its consequence, and no arrow lets reality rewrite the issued action.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfaf5"/>
      <stop offset="1" stop-color="#f0ebe2"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26374f"/>
      <stop offset="1" stop-color="#172338"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#192338" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#168d89"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6f5bd3"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d69a37"/>
    </marker>
  </defs>

  <rect width="720" height="1500" rx="34" fill="url(#paper)"/>
  <rect x="1" y="1" width="718" height="1498" rx="33" fill="none" stroke="#d9d4ca" stroke-width="2"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="44" y="68" fill="#1e293a" font-size="43" font-weight="780">Two loops.</text>
    <text x="44" y="117" fill="#1e293a" font-size="43" font-weight="780">Two different claims.</text>
    <text x="44" y="157" fill="#697487" font-size="24">Closed-loop rollout closes only the first.</text>

    <g transform="translate(44 202)" filter="url(#shadow)">
      <rect width="632" height="445" rx="30" fill="#ffffff"/>
      <rect width="632" height="10" rx="5" fill="#168d89"/>
      <text x="32" y="60" fill="#137873" font-size="26" font-weight="780">1 · POLICY–ENVIRONMENT LOOP</text>
      <text x="32" y="98" fill="#334157" font-size="27" font-weight="720">What does the policy do in simulation?</text>

      <g transform="translate(32 139)">
        <rect width="245" height="90" rx="22" fill="#e8f5f3"/>
        <text x="122.5" y="55" text-anchor="middle" fill="#137873" font-size="29" font-weight="750">Observation</text>
        <path d="M259 45 H319" fill="none" stroke="#168d89" stroke-width="4" marker-end="url(#arrowTeal)"/>
        <rect x="333" width="235" height="90" rx="22" fill="#e8f5f3"/>
        <text x="450.5" y="55" text-anchor="middle" fill="#137873" font-size="29" font-weight="750">Policy</text>

        <path d="M450 103 V148" fill="none" stroke="#168d89" stroke-width="4" marker-end="url(#arrowTeal)"/>

        <rect x="333" y="162" width="235" height="90" rx="22" fill="#e8f5f3"/>
        <text x="450.5" y="217" text-anchor="middle" fill="#137873" font-size="29" font-weight="750">Action</text>
        <path d="M319 207 H259" fill="none" stroke="#168d89" stroke-width="4" marker-end="url(#arrowTeal)"/>
        <rect y="162" width="245" height="90" rx="22" fill="#e8f5f3"/>
        <text x="122.5" y="199" text-anchor="middle" fill="#137873" font-size="27" font-weight="750">Simulated</text>
        <text x="122.5" y="231" text-anchor="middle" fill="#137873" font-size="27" font-weight="750">world</text>
        <path d="M122 148 V104" fill="none" stroke="#168d89" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrowTeal)"/>
      </g>

      <text x="316" y="411" text-anchor="middle" fill="#617c7a" font-size="23">Compounding behavior inside simulation</text>
    </g>

    <g transform="translate(44 690)" filter="url(#shadow)">
      <rect width="632" height="595" rx="30" fill="#ffffff"/>
      <rect width="632" height="10" rx="5" fill="#6f5bd3"/>
      <text x="32" y="60" fill="#5b4bb5" font-size="26" font-weight="780">2 · RESEARCH-DECISION LOOP</text>
      <text x="32" y="98" fill="#334157" font-size="27" font-weight="720">What may we do with the score?</text>

      <g transform="translate(32 135)">
        <rect width="168" height="92" rx="22" fill="#eef1f5"/>
        <text x="84" y="40" text-anchor="middle" fill="#3d4b60" font-size="25" font-weight="750">Finite policy</text>
        <text x="84" y="70" text-anchor="middle" fill="#687588" font-size="23">candidates</text>
        <path d="M181 46 H218" fill="none" stroke="#6f5bd3" stroke-width="4" marker-end="url(#arrowPurple)"/>
        <rect x="232" width="168" height="92" rx="22" fill="#f0edf9"/>
        <text x="316" y="40" text-anchor="middle" fill="#5b4bb5" font-size="25" font-weight="750">Protected</text>
        <text x="316" y="70" text-anchor="middle" fill="#655d8d" font-size="23">simulation</text>
        <path d="M413 46 H450" fill="none" stroke="#6f5bd3" stroke-width="4" marker-end="url(#arrowPurple)"/>
        <rect x="464" width="104" height="92" rx="22" fill="#fff5de" stroke="#e8c477"/>
        <text x="516" y="39" text-anchor="middle" fill="#916315" font-size="23" font-weight="760">Choose</text>
        <text x="516" y="69" text-anchor="middle" fill="#916315" font-size="22">or stop</text>

        <path d="M516 104 V142" fill="none" stroke="#d69a37" stroke-width="4" marker-end="url(#arrowAmber)"/>

        <g transform="translate(328 154)">
          <rect width="240" height="92" rx="24" fill="url(#navy)"/>
          <path d="M27 44 H56 V75 H27 Z M33 44 V35 C33 18 50 18 50 35 V44" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
          <text x="82" y="42" fill="#ffffff" font-size="24" font-weight="750">Seal the action</text>
          <text x="82" y="70" fill="#cbd4df" font-size="20">before reality</text>
        </g>

        <line x1="0" y1="286" x2="568" y2="286" stroke="#d75d55" stroke-width="3" stroke-dasharray="10 9"/>
        <rect x="105" y="268" width="358" height="38" rx="19" fill="#fff0ed"/>
        <text x="284" y="294" text-anchor="middle" fill="#aa4742" font-size="20" font-weight="780">PROTECTED REALITY BOUNDARY</text>

        <rect x="0" y="335" width="216" height="94" rx="22" fill="#fdecea"/>
        <text x="108" y="376" text-anchor="middle" fill="#a64642" font-size="25" font-weight="760">Protected real</text>
        <text x="108" y="407" text-anchor="middle" fill="#8d5d5a" font-size="23">evidence</text>

        <path d="M230 382 H282" fill="none" stroke="#d75d55" stroke-width="4" marker-end="url(#arrowAmber)"/>

        <rect x="296" y="335" width="272" height="94" rx="22" fill="#eef1f5"/>
        <text x="432" y="376" text-anchor="middle" fill="#3d4b60" font-size="25" font-weight="760">Audit unchanged action</text>
        <text x="432" y="407" text-anchor="middle" fill="#687588" font-size="23">and real consequence</text>

        <text x="284" y="480" text-anchor="middle" fill="#687588" font-size="22">Reality judges the seal; it cannot rewrite it.</text>
      </g>
    </g>

    <g transform="translate(44 1330)">
      <rect width="632" height="126" rx="29" fill="url(#navy)"/>
      <circle cx="36" cy="34" r="10" fill="#168d89"/>
      <circle cx="596" cy="34" r="10" fill="#d69a37"/>
      <text x="316" y="50" text-anchor="middle" fill="#ffffff" font-size="29" font-weight="760">Closed loop ≠ closed decision loop</text>
      <text x="316" y="89" text-anchor="middle" fill="#c5ceda" font-size="23">Behavior evidence is not yet permission</text>
      <text x="316" y="116" text-anchor="middle" fill="#c5ceda" font-size="23">to make a real commitment.</text>
    </g>
  </g>
</svg>
