<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Changing task weights changes the question</title>
  <desc id="desc">The same synthetic task panels and actions produce 35 percent coverage and 2.5 percent unconditional harm under equal task weights, but 41 percent coverage and 5.5 percent unconditional harm under cable-heavy weights.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#192338" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#f2eee6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" rx="36" fill="url(#paper)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="74" fill="#1d2635" font-size="31" font-weight="750">The observations stay fixed. The target changes.</text>
    <text x="72" y="110" fill="#687386" font-size="18">Two task mixes applied to the same pair actions and outcomes.</text>

    <g transform="translate(72 156)" filter="url(#shadow)">
      <rect width="1056" height="172" rx="28" fill="#ffffff"/>
      <text x="32" y="42" fill="#505a6c" font-size="15" font-weight="760" letter-spacing="1.3">EQUAL TASKS</text>
      <text x="32" y="73" fill="#7b8493" font-size="16">pick 25% · drawer 25% · insert 25% · cable 25%</text>
      <clipPath id="equalClip"><rect x="32" y="99" width="720" height="45" rx="13"/></clipPath>
      <g clip-path="url(#equalClip)">
        <rect x="32" y="99" width="468" height="45" fill="#667085"/>
        <rect x="500" y="99" width="216" height="45" fill="#168463"/>
        <rect x="716" y="99" width="18" height="45" fill="#39a6a0"/>
        <rect x="734" y="99" width="18" height="45" fill="#d75d55"/>
      </g>
      <text x="801" y="78" fill="#6f5bd3" font-size="15" font-weight="720">COVERAGE</text>
      <text x="801" y="132" fill="#202a3a" font-size="43" font-weight="800">35%</text>
      <text x="930" y="78" fill="#c64c45" font-size="15" font-weight="720">HARM</text>
      <text x="930" y="132" fill="#d75d55" font-size="43" font-weight="800">2.5%</text>
    </g>

    <g transform="translate(72 363)" filter="url(#shadow)">
      <rect width="1056" height="172" rx="28" fill="#ffffff"/>
      <rect width="12" height="172" rx="6" fill="#d69a37"/>
      <text x="32" y="42" fill="#7f571b" font-size="15" font-weight="760" letter-spacing="1.3">CABLE-HEAVY TASK MIX</text>
      <text x="32" y="73" fill="#7b8493" font-size="16">pick 15% · drawer 15% · insert 15% · cable 55%</text>
      <clipPath id="cableClip"><rect x="32" y="99" width="720" height="45" rx="13"/></clipPath>
      <g clip-path="url(#cableClip)">
        <rect x="32" y="99" width="424.8" height="45" fill="#667085"/>
        <rect x="456.8" y="99" width="244.8" height="45" fill="#168463"/>
        <rect x="701.6" y="99" width="10.8" height="45" fill="#39a6a0"/>
        <rect x="712.4" y="99" width="39.6" height="45" fill="#d75d55"/>
      </g>
      <text x="801" y="78" fill="#6f5bd3" font-size="15" font-weight="720">COVERAGE</text>
      <text x="801" y="132" fill="#202a3a" font-size="43" font-weight="800">41%</text>
      <text x="930" y="78" fill="#c64c45" font-size="15" font-weight="720">HARM</text>
      <text x="930" y="132" fill="#d75d55" font-size="43" font-weight="800">5.5%</text>
    </g>

    <g transform="translate(72 574)">
      <rect width="1056" height="56" rx="18" fill="#242e3d"/>
      <circle cx="31" cy="28" r="7" fill="#d69a37"/>
      <text x="52" y="35" fill="#f4f1ea" font-size="18" font-weight="650">Weights change which comparisons matter; the observations do not.</text>
      <text x="908" y="35" fill="#ff9d94" font-size="17" font-weight="760">harm × 2.2</text>
    </g>
  </g>
</svg>
